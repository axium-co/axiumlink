<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

  <title>Nome do Cliente | Link Bio</title>

  <!-- ================================================================
       SEO / Compartilhamento
       ================================================================ -->
  <meta name="description" content="Links e contatos de Nome do Cliente. Agende pelo WhatsApp, siga no Instagram e veja nossa localização." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Nome do Cliente | Link Bio" />
  <meta property="og:description" content="Links e contatos de Nome do Cliente." />
  <meta property="og:image" content="icon-512.png" />
  <meta name="twitter:card" content="summary" />

  <!-- ================================================================
       PWA — substitua pelos ícones reais depois
       ================================================================ -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Nome do Cliente" />

  <!-- Fonte Inter (fallback para system-ui se offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

  <!-- ================================================================
       DESIGN SYSTEM INJETÁVEL
       ----------------------------------------------------------------
       Estes valores são injetados dinamicamente (banco de dados ou
       painel de controle do cliente). Altere apenas as variáveis —
       todo o resto do CSS consome estes tokens.
       ================================================================ -->
  <style>
    :root {
      /* == Configurações Globais da Página == */
      --page-bg: #ffffff;            /* Cor ou Gradiente de fundo do site do cliente */
      --font-main: 'Inter', sans-serif; /* Fonte escolhida pelo cliente */

      /* == Cores de Textos == */
      --text-title: #000000;         /* Cor do nome do cliente */
      --text-body: #555555;          /* Cor da biografia, endereço e descrições */

      /* == Botões Superiores (Ações Rápidas) == */
      --btn-quick-bg: #000000;       /* Fundo dos 4 botões menores */
      --btn-quick-text: #ffffff;     /* Texto/Ícone dos 4 botões menores */

      /* == Cards Inferiores (Destaques) == */
      --card-destaque-bg: #000000;   /* Fundo dos 3 cards maiores */
      --card-destaque-text: #ffffff; /* Texto/Ícone dos 3 cards maiores */

      /* == Modificadores de Formato (Bordas) == */
      --global-radius: 12px;         /* 0px = quadrado | 12px = arredondado | 30px = oval */
      --global-border: 1px solid transparent; /* Borda opcional p/ estilo "Outline" */

      /* == Tokens de apoio (avançado) == */
      --max-width: 560px;
      --spacing: 1.0625rem;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ================================================================
       RESET / BASE
       ================================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: var(--font-main);
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--text-title);
      background: var(--page-bg);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    button {
      font-family: inherit;
      font-size: inherit;
      border: none;
      cursor: pointer;
      background: none;
      color: inherit;
    }

    /* ================================================================
       ANIMAÇÃO PADRÃO (adaptativa — independe da cor do botão)
       ================================================================ */
    .btn, .quick__item, .featured__card {
      transition: transform var(--transition), box-shadow var(--transition),
                  filter var(--transition);
    }

    .btn:hover, .quick__item:hover, .featured__card:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow);
      filter: brightness(1.06);
    }

    .btn:active, .quick__item:active, .featured__card:active {
      transform: scale(0.98);
      filter: brightness(0.92);
      box-shadow: none;
    }

    /* ================================================================
       LAYOUT GERAL
       ================================================================ */
    .page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 3rem var(--spacing) 2rem;
      flex: 1 0 auto;
    }

    /* ================================================================
       HEADER — PERFIL DO CLIENTE
       ================================================================ */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      width: 100%;
    }

    /* Avatar/logo obedece --global-radius para consistência visual */
    .profile__avatar {
      width: 96px;
      height: 96px;
      border-radius: var(--global-radius);
      background: var(--btn-quick-bg);
      color: var(--btn-quick-text);
      border: var(--global-border);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 2.5rem;
      font-weight: 700;
    }

    .profile__avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile__title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-title);
    }

    .profile__subtitle {
      font-size: 0.875rem;
      color: var(--text-body);
      max-width: 34ch;
    }

    /* Exibido apenas se o cliente preencheu o endereço no banco.
       Remova toda a tag <a class="profile__address"> se estiver vazio. */
    .profile__address {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      color: var(--text-body);
      border: var(--global-border);
      border-color: color-mix(in srgb, var(--text-body) 22%, transparent);
      padding: 0.375rem 0.875rem;
      border-radius: 999px;
      transition: box-shadow var(--transition);
    }

    .profile__address:hover { box-shadow: var(--shadow); }

    .profile__address svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ================================================================
       FLUXO LIVRE — botões e cards num único container flex
       (order/largura definidos pelo Painel Axiumlink)
       ================================================================ */
    .page-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: stretch;
    }

    .pg-item--full { flex: 1 1 100%; }
    .pg-item--half { flex: 1 1 calc(50% - 0.5rem); }
    .pg-item--auto { flex: 0 1 auto; }

    .pg-strip {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.75rem;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .pg-strip::-webkit-scrollbar { display: none; }

    .pg-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pg-links--grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }

    .pg-links--scroll {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.75rem;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .pg-links--scroll::-webkit-scrollbar { display: none; }
    .pg-links--scroll .featured__card { flex: 0 0 auto; width: auto; min-width: 15rem; }

    /* ---- Ações Rápidas: grade compacta 2x2 (identidade própria) ---- */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    .quick-grid[hidden] { display: none; }

    .quick-grid--list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quick-grid--scroll {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .quick-grid--scroll::-webkit-scrollbar { display: none; }

    .quick-grid--scroll .quick__item { flex: 0 0 auto; width: auto; min-width: 7.5rem; }

    .quick__item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      min-height: 3.25rem;
      background: var(--btn-quick-bg);
      color: var(--btn-quick-text);
      border: var(--global-border);
      border-radius: var(--global-radius);
      padding: 0.5rem 0.375rem;
      font-size: 0.62rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      will-change: transform;
    }

    .quick__item svg { width: 16px; height: 16px; flex-shrink: 0; }

    .quick-grid .quick__item:only-child { grid-column: 1 / -1; }

    /* ================================================================
       CARDS DE DESTAQUE (ícone à esquerda, texto à direita)
       ================================================================ */
    .featured__card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card-destaque-bg);
      color: var(--card-destaque-text);
      border: var(--global-border);
      border-radius: var(--global-radius);
      padding: 1.125rem 1rem;
      text-align: left;
      will-change: transform;
    }

    .featured__icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: calc(var(--global-radius) * 0.6);
      background: color-mix(in srgb, var(--card-destaque-text) 16%, transparent);
      overflow: hidden;
    }

    .featured__icon svg { width: 28px; height: 28px; }
    .featured__icon-img { width: 100%; height: 100%; object-fit: cover; }

    .featured__body {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
      min-width: 0;
    }

    .featured__body strong {
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .featured__body span {
      font-size: 0.8125rem;
      opacity: 0.78;
    }

    .featured__arrow {
      flex-shrink: 0;
      margin-left: auto;
      width: 18px;
      height: 18px;
      opacity: 0.7;
      transition: transform var(--transition);
    }

    .featured__card:hover .featured__arrow { transform: translateX(3px); }

    /* ---- Card com imagem completa (estilo Beacons) ---- */
    .featured__card--banner {
      position: relative;
      padding: 0;
      overflow: hidden;
      aspect-ratio: 2 / 1;
      min-height: 0;
    }

    .featured__banner-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .featured__card--banner:hover .featured__banner-img { transform: scale(1.02); }
    .featured__banner-img { transition: transform var(--transition); }

    /* ================================================================
       FOOTER DA PLATAFORMA
       ================================================================ */
    .site-footer {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.875rem;
      padding: 1.5rem var(--spacing) 2rem;
      border-top: 1px solid color-mix(in srgb, var(--text-body) 24%, transparent);
    }

    .site-footer__pwa {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--page-bg);
      border: 1px solid color-mix(in srgb, var(--text-body) 24%, transparent);
      border-radius: 999px;
      padding: 0.625rem 1.125rem;
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .site-footer__pwa:hover { box-shadow: var(--shadow); }
    .site-footer__pwa:active { transform: scale(0.98); }
    .site-footer__pwa svg { width: 16px; height: 16px; }

    /* Link discreto de acesso ao painel (engrenagem) */
    .site-footer__admin {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--text-body) 62%, transparent);
      opacity: 0.75;
      transition: opacity var(--transition), color var(--transition);
    }

    .site-footer__admin:hover { opacity: 1; }
    .site-footer__admin svg { width: 15px; height: 15px; }

    /* Cor neutra e discreta — deriva de --text-body, adaptando-se a
       fundos claros e escuros conforme a escolha do cliente */
    .site-footer__brand {
      font-size: 0.75rem;
      color: color-mix(in srgb, var(--text-body) 78%, transparent);
    }

    .site-footer__brand a {
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ================================================================
       MODAL PIX (elemento nativo <dialog>)
       ================================================================ */
    .pix-modal {
      position: relative;
      width: calc(100% - 2.5rem);
      max-width: 360px;
      border: none;
      border-radius: var(--global-radius);
      background: var(--page-bg);
      color: var(--text-title);
      padding: 1.75rem 1.5rem;
      margin: auto;
    }

    .pix-modal::backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
    }

    .pix-modal[open] { animation: modal-in 0.2s ease; }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pix-modal__title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .pix-modal__text {
      font-size: 0.8125rem;
      color: var(--text-body);
      margin-bottom: 1rem;
    }

    .pix-modal__key {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: var(--btn-quick-bg);
      color: var(--btn-quick-text);
      border-radius: calc(var(--global-radius) * 0.6);
      padding: 0.75rem 0.875rem;
      font-size: 0.8125rem;
      word-break: break-all;
      margin-bottom: 0.875rem;
    }

    .pix-modal__copy {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--btn-quick-bg);
      background: var(--btn-quick-text);
      border-radius: calc(var(--global-radius) * 0.5);
      padding: 0.375rem 0.625rem;
      transition: filter var(--transition);
    }

    .pix-modal__copy:hover { filter: brightness(0.9); }

    .pix-modal__qr {
      background: color-mix(in srgb, var(--text-title) 6%, transparent);
      border: 1px dashed color-mix(in srgb, var(--text-title) 18%, transparent);
      border-radius: calc(var(--global-radius) * 0.6);
      height: 140px;
      display: grid;
      place-items: center;
      font-size: 0.8125rem;
      color: var(--text-body);
      margin-bottom: 0.875rem;
    }

    .pix-modal__cta {
      display: block;
      width: 100%;
      text-align: center;
      font-weight: 600;
      background: var(--btn-quick-bg);
      color: var(--btn-quick-text);
      border-radius: var(--global-radius);
      padding: 0.875rem;
      transition: transform var(--transition), filter var(--transition);
    }

    .pix-modal__cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .pix-modal__cta:active { transform: scale(0.98); }

    .pix-modal__close {
      position: absolute;
      top: 0.625rem;
      right: 0.625rem;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--text-title) 8%, transparent);
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
    }

    /* ================================================================
       DESKTOP
       ================================================================ */
    @media (min-width: 640px) {
      .page-flow { gap: 1.25rem; }
    }

    @media (min-width: 768px) {
      .profile__avatar { width: 112px; height: 112px; }

      /* Cards de destaque centralizados no desktop */
      .featured__card {
        flex-direction: column;
        text-align: center;
        padding: 1.5rem 1.125rem;
        gap: 0.75rem;
      }

      .featured__arrow { display: none; }
    }
  </style>

  <!-- Configuração dinâmica do cliente (gerada pelo Painel Axiumlink) -->
  <script src="config.js"></script>
</head>

<body>
  <main class="page">
    <div class="page-flow" id="pageFlow">

    <!-- ================================================================
         HEADER — PERFIL DO CLIENTE

       MODAL PIX (elemento nativo <dialog>)
       ================================================================ -->

    <h2 class="pix-modal__title" id="pix-title">Pague com PIX</h2>

      <button class="pix-modal__copy" type="button" data-copy>Copiar</button>

  </dialog>

  <script>
    /* ================================================================
       MODAL PIX (nativo <dialog>)
       ================================================================ */
    const dialog = document.querySelector('[data-dialog]');

    if (dialog) {
      document.addEventListener('click', (e) => {
        if (e.target.closest('[data-dialog-open]') && !dialog.open) dialog.showModal();
      });

      document.querySelectorAll('[data-dialog-close]').forEach((btn) => {
        btn.addEventListener('click', () => dialog.close());
      });

      dialog.addEventListener('click', (e) => {
        const rect = dialog.getBoundingClientRect();
        const inBox =
          e.clientX >= rect.left && e.clientX <= rect.right &&
          e.clientY >= rect.top && e.clientY <= rect.bottom;
        if (!inBox) dialog.close();
      });

      dialog.addEventListener('cancel', () => dialog.close());
    }

    /* ================================================================
       COPIAR CHAVE PIX (clipboard com fallback)
       ================================================================ */
    const copyBtn = document.querySelector('[data-copy]');

    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const key = document.getElementById('pix-key');
        try {
          await navigator.clipboard.writeText(key.textContent.trim());
        } catch {
          const range = document.createRange();
          range.selectNodeContents(key);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          document.execCommand('copy');
          sel.removeAllRanges();
        }
        copyBtn.textContent = 'Copiado!';
        setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
      });
    }

    /* ================================================================
       PWA — "ADICIONAR À TELA INICIAL"
       ================================================================ */
    const pwaBtn = document.querySelector('[data-pwa]');

    if (pwaBtn) {
      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBtn.style.display = 'inline-flex';
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        pwaBtn.style.display = 'none';
      });

      pwaBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          pwaBtn.style.display = 'none';
        } else {
          alert('Instalação disponível no Chrome/Edge (Android e desktop).');
        }
      });
    }
  </script>

  <script>
    /* ================================================================
       APLICAR CONFIGURAÇÃO DO CLIENTE (Painel Axiumlink)
       ----------------------------------------------------------------
       Prioridade: 1) localStorage salvo pelo admin.html
                   2) config.js (defaults/deploy)
       Atualiza as CSS Variables (:root) e os textos/links da página.
       ================================================================ */
    (function applyClientConfig() {
      const STORAGE_KEY = 'axiumlink-preview-v1';

      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}

      const defaults = (typeof window.AXIUMLINK_CONFIG !== 'undefined' && window.AXIUMLINK_CONFIG)
        ? window.AXIUMLINK_CONFIG
        : null;

      const cfg = saved || defaults;
      if (!cfg) return;

      /* ---- achatando a config para mapear diretamente nos elementos ---- */
      const p = cfg.profile || {};
      const v = cfg.visual || {};

      const flat = {
        profileName: p.name,
        profileBio: p.bio,
        profileAddress: p.address
      };

      /* ---- textos ---- */
      document.querySelectorAll('[data-bind]').forEach((el) => {
        const val = flat[el.dataset.bind];
        if (val != null) el.textContent = val;
      });

      /* ---- CSS Variables ---- */
      const root = document.documentElement.style;
      const set = (name, value) => { if (value != null) root.setProperty(name, value); };

      set('--page-bg', v.pageBg);
      set('--text-title', v.textColor);

      /* Subtítulo/descrições = texto misturado com o fundo (tom suave) */
      if (v.textColor && v.pageBg) {
        set('--text-body', mixHex(v.textColor, v.pageBg, 0.72));
      }

      set('--btn-quick-bg', v.quickBg);
      set('--btn-quick-text', v.quickText);
      set('--card-destaque-bg', v.cardBg);
      set('--card-destaque-text', v.cardText);

      /* ---- Foto de perfil (data URL recortada no painel) ---- */
      if (p.photo) {
        const avatarImg = document.getElementById('pgAvatarImg');
        const avatarLetter = document.getElementById('pgAvatarLetter');
        if (avatarImg && avatarLetter) {
          avatarImg.src = p.photo;
          avatarImg.hidden = false;
          avatarLetter.hidden = true;
        }
      }

      /* ---- Formato dos botões/cards (enum -> CSS; legado 0px/12px/30px) ---- */
      const radiusMap = {
        'quadrado':           { css: '0px',               extras: {} },
        'leve-arredondado':   { css: '8px',               extras: {} },
        'arredondado':        { css: '14px',              extras: {} },
        'totalmente-oval':    { css: '999px',             extras: {} },
        'assimetrico':        { css: '14px 4px 14px 4px', extras: {} },
        'outline':            { css: '10px',              extras: { border: '2px solid currentColor', boxShadow: 'none' } },
        'sombra-bloco':       { css: '10px',              extras: { boxShadow: '6px 6px 0 0 rgba(0,0,0,0.25)' } },
        'suave-sombra':       { css: '12px',              extras: { boxShadow: '0 10px 24px rgba(0,0,0,0.18)' } }
      };
      const radiusValue = (v.radius === '0px') ? 'quadrado'
                        : (v.radius === '30px') ? 'totalmente-oval'
                        : v.radius;
      const radiusOpt = radiusMap[radiusValue] || radiusMap.arredondado;
      set('--global-radius', radiusOpt.css);
      document.querySelectorAll('.quick__item, .featured__card').forEach((t) => {
        t.style.border = radiusOpt.extras.border || '';
        t.style.boxShadow = radiusOpt.extras.boxShadow || '';
      });

      set('--font-main', "'" + (v.font || 'Inter') + "', sans-serif");

      /* ---- Imagem de fundo da página ---- */
      if (v.bgImage) {
        document.body.style.backgroundImage = 'url(' + v.bgImage + ')';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
      }

      /* ---- Layout livre (ordem, largura e modos por seção) ---- */
      const lay = cfg.layout || {};
      const layItems = lay.items || {};
      const quickMode = lay.quickMode || 'grid2x2';
      const cardsMode = lay.cardsMode || 'list';

      /* ---- Ações Rápidas dinâmicas (cfg.quickActions ou migra formato antigo) ---- */
      const quickIcons = {
        mensagem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
        telefone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>',
        download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
        pix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
        email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
        localizacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
        whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>',
        instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>',
        site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>',
        outro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
      };

      function quickHref(url, icon) {
        const value = String(url || '').trim();
        if (!value) return '#';
        if (/^(https?:|mailto:|tel:|sms:)/i.test(value)) return value;
        if (icon === 'telefone') return 'tel:' + value.replace(/[^+\d]/g, '');
        if (icon === 'email') return 'mailto:' + value;
        return 'https://' + value;
      }

      function quickActionsFromLegacy(obj) {
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
        const map = [
          { key: 'contactLink', title: 'Contato', icon: 'mensagem' },
          { key: 'vcf', title: 'Salvar Contato', icon: 'download' },
          { key: 'phone', title: 'Ligar', icon: 'telefone' },
          { key: 'pixKey', title: 'PIX', icon: 'pix' }
        ];
        const seed = map
          .map((m) => {
            const url = String(obj[m.key] || '').trim();
            return url ? { title: m.title, url: m.icon === 'pix' ? '#' : url, icon: m.icon } : null;
          })
          .filter(Boolean);
        return seed.length ? seed : null;
      }

      const quickContainer = document.getElementById('pgQuick');
      const quickList = Array.isArray(cfg.quickActions)
        ? cfg.quickActions
        : quickActionsFromLegacy(cfg.quickActions);

      if (quickContainer && Array.isArray(quickList) && quickList.length) {
        quickContainer.classList.remove('quick-grid--list', 'quick-grid--scroll');
        if (quickMode === 'list') quickContainer.classList.add('quick-grid--list');
        else if (quickMode === 'scroll') quickContainer.classList.add('quick-grid--scroll');

        const pixKeyEl = document.getElementById('pix-key');

        quickList.forEach((action) => {
          const isPix = action.icon === 'pix';
          const node = document.createElement(isPix ? 'button' : 'a');
          node.className = 'quick__item';
          node.type = 'button';

          if (isPix) {
            node.setAttribute('data-dialog-open', '');
            if (pixKeyEl && action.url && action.url !== '#') {
              pixKeyEl.textContent = action.url;
            }
          } else {
            node.href = quickHref(action.url, action.icon);
            if (/^(tel:|mailto:|sms:|#)/i.test(node.href)) {
              node.removeAttribute('target');
              node.removeAttribute('rel');
            } else {
              node.target = '_blank';
              node.rel = 'noopener';
            }
          }

          node.insertAdjacentHTML('afterbegin', quickIcons[action.icon] || quickIcons.link);

          const label = document.createElement('span');
          label.textContent = action.title || 'Nova Ação';
          node.appendChild(label);

          quickContainer.appendChild(node);
        });
      } else if (quickContainer) {
        quickContainer.hidden = true;
      }

      /* ---- Lista de links dinâmicos (cfg.links ou migra cards antigos) ---- */
      const linkIcons = {
        whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>',
        instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>',
        site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>',
        telefone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>',
        localizacao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
        outro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
      };

      function linkHref(url, icon) {
        const value = String(url || '').trim();
        if (!value) return '#';
        if (/^(https?:|mailto:|tel:|sms:)/i.test(value)) return value;
        if (icon === 'telefone') return 'tel:' + value.replace(/[^+\d]/g, '');
        return 'https://' + value;
      }

      function linksFromCards(cards) {
        const map = { whatsapp: 'whatsapp', instagram: 'instagram', maps: 'localizacao' };
        return ['whatsapp', 'instagram', 'maps']
          .map((k) => {
            const c = (cards || {})[k];
            return (c && c.link)
              ? { title: c.title || '', url: c.link, icon: map[k], image: c.icon || null }
              : null;
          })
          .filter(Boolean);
      }

      const linksContainer = document.getElementById('pgLinks');
      const linkList = Array.isArray(cfg.links) ? cfg.links : linksFromCards(cfg.cards);
      if (linksContainer && linkList.length) {
        linksContainer.classList.toggle('pg-links--grid', cardsMode === 'grid2');
        linkList.forEach((link) => {
          const a = document.createElement('a');
          a.className = 'featured__card';
          a.href = linkHref(link.url, link.icon);
          a.target = '_blank';
          a.rel = 'noopener';

          const isBanner = !!(link.image && link.style === 'banner');

          if (isBanner) {
            a.classList.add('featured__card--banner');
            const img = document.createElement('img');
            img.className = 'featured__banner-img';
            img.src = link.image;
            img.alt = link.title || '';
            a.appendChild(img);
          } else {
            const icon = document.createElement('span');
            icon.className = 'featured__icon';
            icon.setAttribute('aria-hidden', 'true');
            if (link.image) {
              const img = document.createElement('img');
              img.className = 'featured__icon-img';
              img.src = link.image;
              img.alt = '';
              icon.appendChild(img);
            } else {
              icon.innerHTML = linkIcons[link.icon] || linkIcons.outro;
            }
            a.appendChild(icon);

            const body = document.createElement('span');
            body.className = 'featured__body';
            const strong = document.createElement('strong');
            strong.textContent = link.title || 'Novo Link';
            const desc = document.createElement('span');
            desc.textContent = link.url || '';
            body.appendChild(strong);
            body.appendChild(desc);
            a.appendChild(body);

            const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            arrow.setAttribute('class', 'featured__arrow');
            arrow.setAttribute('viewBox', '0 0 24 24');
            arrow.setAttribute('fill', 'none');
            arrow.setAttribute('stroke', 'currentColor');
            arrow.setAttribute('stroke-width', '2');
            arrow.setAttribute('stroke-linecap', 'round');
            arrow.setAttribute('stroke-linejoin', 'round');
            arrow.setAttribute('aria-hidden', 'true');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', 'm9 18 6-6-6-6');
            arrow.appendChild(path);
            a.appendChild(arrow);
          }

          linksContainer.appendChild(a);
        });
      }

      document.querySelectorAll('.quick__item, .featured__card').forEach((t) => {
        t.style.border = radiusOpt.extras.border || '';
        t.style.boxShadow = radiusOpt.extras.boxShadow || '';
      });

      function clampOrder(value, fallback) {
        const n = parseInt(value, 10);
        if (Number.isNaN(n)) return fallback;
        return Math.min(10, Math.max(1, n));
      }

      const flow = document.getElementById('pageFlow');
      const profile = document.getElementById('pageProfile');

      if (flow && profile) {
        profile.style.order = clampOrder(lay.info && lay.info.order, 1);
        profile.style.display = (lay.info && lay.info.hidden) ? 'none' : '';

        const sections = [
          { key: 'quick', node: quickContainer, mode: quickMode, order: 2 },
          { key: 'links', node: linksContainer, mode: cardsMode, order: 3 }
        ]
          .map((s) => {
            const conf = layItems[s.key] || (lay[s.key] || {});
            return {
              key: s.key,
              node: s.node,
              mode: s.mode,
              order: clampOrder(conf.order, s.order),
              visible: s.mode !== 'hidden'
            };
          })
          .filter((s) => s.node && s.visible)
          .sort((a, b) => a.order - b.order);

        flow.replaceChildren(profile);
        sections.forEach((s) => {
          s.node.style.order = s.order;
          s.node.classList.remove('pg-item--half', 'pg-item--auto');
          s.node.classList.add('pg-item--full');

          if (s.key === 'links') {
            linksContainer.classList.remove('pg-links--grid');
            if (cardsMode === 'carousel' || cardsMode === 'scroll') {
              linksContainer.classList.add('pg-links--scroll');
            }
          }

          flow.appendChild(s.node);
        });
      }

      /* ---- título do documento ---- */
      if (p.name) document.title = p.name + ' | Link Bio';

      /* ============================================================
         HELPERS DE COR (mistura de hex)
         ============================================================ */
      function hexToRgb(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function mixHex(c1, c2, t) {
        const a = hexToRgb(c1);
        const b = hexToRgb(c2);
        const rgb = a.map((x, i) => Math.round(x + (b[i] - x) * t));
        return '#' + rgb.map((x) => x.toString(16).padStart(2, '0')).join('');
      }
    })();
  </script>
</body>
